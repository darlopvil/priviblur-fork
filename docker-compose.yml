services:
  priviblur:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Pasa el hash del commit a la imagen sin meter .git/ dentro:
        #   PRIVIBLUR_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
        PRIVIBLUR_COMMIT: ${PRIVIBLUR_COMMIT:-unknown}
    image: priviblur-fork:local
    restart: unless-stopped
    environment:
      # El fichero se monta como directorio a proposito: los bind mounts de
      # fichero suelto se rompen con los editores que guardan de forma atomica
      - PRIVIBLUR_CONFIG_LOCATION=/config/config.toml
    volumes:
      - ./deploy:/config:ro
    networks:
      - priviblur-internal
    depends_on:
      priviblur-valkey:
        condition: service_healthy

    # Cache. Opcional en teoria, pero sin ella cada peticion va a Tumblr.
  #
  # Valkey es el fork de Redis mantenido por la Linux Foundation desde que
  # Redis cambio a una licencia no libre en 2024. Habla el mismo protocolo, asi
  # que el cliente de Python no necesita ningun cambio.
  priviblur-valkey:
    image: valkey/valkey:8-alpine
    # Solo cache: sin persistencia a disco, asi que no hace falta volumen
    # maxmemory con politica LRU: sin limite, la cache crece hasta que expiran
    # las claves por TTL, lo que en una maquina con poca RAM libre compite con
    # el resto del sistema. Con el limite, Valkey descarta las claves menos
    # usadas al llegar al tope y nunca pasa de ahi.
    command: >
      valkey-server --loglevel warning --save "" --appendonly no
      --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    # Se ejecuta directamente como el usuario valkey para saltarse el chown del
    # entrypoint, que necesita CAP_CHOWN y falla con cap_drop: ALL
    user: "valkey"
    read_only: true
    tmpfs:
      - /data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - priviblur-internal

networks:
  priviblur-internal:
    driver: bridge

# Este fichero NO publica puertos al host: asume proxy inverso.
# Para acceso directo, crea un docker-compose.override.yml con:
#
#   services:
#     priviblur:
#       ports:
#         - "127.0.0.1:8000:8000"
