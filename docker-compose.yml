services:
  priviblur:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: priviblur-fork:local
    restart: unless-stopped
    environment:
      # El fichero se monta como directorio a proposito: los bind mounts de
      # fichero suelto se rompen con los editores que guardan de forma atomica
      - PRIVIBLUR_CONFIG_LOCATION=/config/config.toml
    volumes:
      - ./deploy:/config:ro
    networks:
      - priviblur-internal
    depends_on:
      priviblur-redis:
        condition: service_healthy

    # Cache. Opcional en teoria, pero sin ella cada peticion va a Tumblr.
  priviblur-redis:
    image: redis:7-alpine
    # Solo cache: sin persistencia a disco, asi que no hace falta volumen
    command: redis-server --loglevel warning --save "" --appendonly no
    restart: unless-stopped
    # Se ejecuta directamente como el usuario redis para saltarse el chown del
    # entrypoint, que necesita CAP_CHOWN y falla con cap_drop: ALL
    user: "redis"
    read_only: true
    tmpfs:
      - /data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - priviblur-internal

networks:
  priviblur-internal:
    driver: bridge

# Este fichero NO publica puertos al host: asume proxy inverso.
# Para acceso directo, crea un docker-compose.override.yml con:
#
#   services:
#     priviblur:
#       ports:
#         - "127.0.0.1:8000:8000"
