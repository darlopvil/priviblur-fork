# Controls deployment options
[deployment]
    host = "0.0.0.0" # Set to 127.0.0.1 if you use a reverse proxy, or access it locally
    port = 8000

    # # Hostname under which the instance is hosted, WITHOUT a scheme.
    # # Correct:   domain = "priviblur.example.com"
    # # Incorrect: domain = "https://priviblur.example.com"
    # #
    # # Used both as the Domain attribute of the settings cookie, which must be
    # # a bare hostname, and as the prefix of absolute URLs in feeds, whose
    # # scheme is taken from the `https` option below.
    # #
    # # By default it is unset, which means relative URLs and a cookie scoped
    # # to whatever host served the page. That works for browsing; set it if you
    # # care about the feeds being consumed elsewhere.
    # domain = "priviblur.example.com"

    # Enables secure cookies and forces all links
    # to priviblur to use the `https://` scheme
    https = false

    # # Amount of worker Priviblur instances to spawn. Increases speed significantly.
    # workers = 1


# # Controls redis cache options
# # Ignore to disable the cache
# # 
# # To enable caching, Redis is required, you then have to uncomment "url" and set it accordingly. Every other options in this section will use their default value (indicated next to them) if they are kept commented out.
# [cache]
    # url =
    # # For docker use the following:
    # url = "redis://priviblur-valkey:6379"
    # #
    # # The redis:// scheme is correct for Valkey too: it speaks the same
    # # protocol and the Python client is the same one.

    # # Number of seconds to cache poll results from active polls
    # cache_active_poll_results_for = 3600

    # # Number of seconds to cache poll results from expired polls
    # cache_expired_poll_results_for = 86400

    # # Number of seconds to cache feed (explore, search, etc) results for
    # cache_feed_for = 3600

    # # Number of seconds to cache blog feed (blog posts, blog search, blog tagged posts, etc) results for
    # cache_blog_feed_for = 3600

    # # Number of seconds to cache individual posts for
    # cache_blog_post_for = 300

# # Controls behaviors pertaining to the way Priviblur requests Tumblr
# [priviblur_backend]
    # # Total timeout for requests to Tumblr's API, in seconds.
    # # Covers the whole operation: connecting, sending and reading the response.
    # main_response_timeout = 10

    # # Total timeout for fetching image responses from Tumblr, in seconds.
    # image_response_timeout = 30

    # # Optional per-phase timeouts, in seconds. Both are unset by default,
    # # meaning only the total above applies.
    # #
    # # Splitting them lets Priviblur fail fast on an unreachable host while
    # # still giving a slow but working response time to finish. A large blog
    # # can take over a second to arrive on a good day.
    # #
    # # connect: giving up while establishing the connection
    # # read: giving up between two chunks of data
    # main_connect_timeout = 5
    # main_read_timeout = 30
    # image_connect_timeout = 5
    # image_read_timeout = 60

    # # Bearer token sent to Tumblr's API. Unset uses the built-in one.
    # #
    # # The built-in token is the public bearer of Tumblr's own web client: it
    # # is the same for everybody and is not a private credential. It is also
    # # static, so if Automattic ever invalidates it every instance breaks at
    # # once. This option exists so that can be fixed by editing a file instead
    # # of rebuilding.
    # #
    # # The "Bearer " prefix is optional.
    # authorization_token = "..."


# # Controls default user preferences
# [default_user_preferences]
#
#     # User interface theme
#     # Acceptable values: [auto, light, dark]
#     theme = "auto"
#
#     # User interface language
#     # For available options see SUPPORTED_LANGUAGES constant in src/helpers/i18n.py
#     language = "en_US"


# Controls logging behavior
#
# Use Python's numerical logging levels
# https://docs.python.org/3/howto/logging.html#logging-levels
# [logging]
    # # Sanic (Server)'s logging level'
    # sanic_logging_level = 30

    # # Priviblur's logging level
    # priviblur_logging_level = 30

    # # Priviblur extractor's logging level
    # priviblur_extractor_logging_level = 20


# [misc]
    # # Enable sanic's dev mode
    # dev_mode = false